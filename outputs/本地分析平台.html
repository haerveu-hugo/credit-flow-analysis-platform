<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本地分析平台</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef2f5;color:#162033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}header{min-height:64px;background:#20252d;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 22px;gap:15px}h1{font-size:20px;margin:0;white-space:nowrap}.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}button,a.btn{border:0;border-radius:8px;background:#edf3f7;color:#1b4050;padding:10px 14px;cursor:pointer;text-decoration:none;font-size:14px}button.active{background:#2d7d9a;color:#fff}main{height:calc(100vh - 64px);display:grid;grid-template-rows:auto 1fr}.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;background:#fff;border-bottom:1px solid #d7dee8}.hint{color:#677485;font-size:13px}iframe{width:100%;height:100%;border:0;background:#fff}@media(max-width:760px){header{align-items:flex-start;flex-direction:column}.tabs{justify-content:flex-start}main{height:calc(100vh - 116px)}}
</style></head><body><header><h1>本地分析平台</h1><div class="tabs"><button data-key="credit">征信分析</button><button data-key="flow">流水统计</button><button data-key="financial">财务报表分析</button><button data-key="comprehensive">综合分析</button></div></header><main><div class="bar"><div class="hint" id="hint"></div><a class="btn" id="openNew" target="_blank">新窗口打开</a></div><iframe id="frame"></iframe></main><script>
const items={credit:{name:'征信分析',url:'http://127.0.0.1:8789/'},flow:{name:'流水统计',url:'http://127.0.0.1:8790/flow'},financial:{name:'财务报表分析',url:'http://127.0.0.1:8793/financial'},comprehensive:{name:'综合分析',url:'http://127.0.0.1:8792/comprehensive'}},frame=document.getElementById('frame'),hint=document.getElementById('hint'),openNew=document.getElementById('openNew');function show(key){const x=items[key]||items.credit;frame.src=x.url;openNew.href=x.url;hint.textContent='当前：'+x.name;document.querySelectorAll('[data-key]').forEach(b=>b.classList.toggle('active',b.dataset.key===key));localStorage.setItem('analysisPlatformTab',key)}document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>show(b.dataset.key));show(items[localStorage.getItem('analysisPlatformTab')]?localStorage.getItem('analysisPlatformTab'):'credit');
</script></body></html>
